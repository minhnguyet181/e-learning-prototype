<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <body th:replace="layout :: layout('Đăng ký', ~{::content})">
    <th:block th:fragment="content">
      <main>
        <div class="container">
          <h2>Đăng ký</h2>
          <form th:action="@{/register}" th:object="${form}" method="post">
            <label>Họ và tên</label>
            <input th:field="*{fullName}" autocomplete="name" />
            <div class="error-text" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>

            <label>Email</label>
            <input th:field="*{email}" type="email" autocomplete="email" />
            <div class="error-text" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

            <label>Mật khẩu</label>
            <input th:field="*{password}" type="password" autocomplete="new-password" />
            <div class="error-text" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>

            <label>Xác nhận mật khẩu</label>
            <input th:field="*{confirmPassword}" type="password" autocomplete="new-password" />
            <div class="error-text" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>

            <button type="submit">Đăng ký</button>
          </form>

          <div class="helper">
            Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a>
          </div>
        </div>
      </main>
    </th:block>
  </body>
</html>
