<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <body th:replace="layout :: layout('Đăng ký', ~{::content})">
    <th:block th:fragment="content">
      <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
          <div class="card">
            <div class="card-body">
              <h1 class="h4 mb-3">Đăng ký tài khoản</h1>

              <form th:action="@{/register}" th:object="${form}" method="post" class="vstack gap-3">
                <div>
                  <label class="form-label">Username</label>
                  <input class="form-control" th:field="*{username}" autocomplete="username" />
                  <div class="text-danger small" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                </div>
                <div>
                  <label class="form-label">Email</label>
                  <input class="form-control" th:field="*{email}" autocomplete="email" />
                  <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
                <div>
                  <label class="form-label">Họ và tên</label>
                  <input class="form-control" th:field="*{fullName}" autocomplete="name" />
                  <div class="text-danger small" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                </div>
                <div>
                  <label class="form-label">Mật khẩu</label>
                  <input class="form-control" th:field="*{password}" type="password" autocomplete="new-password" />
                  <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>

                <button class="btn btn-warning" type="submit">Tạo tài khoản</button>
              </form>

              <hr />
              <div class="small">
                Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </th:block>
  </body>
</html>
