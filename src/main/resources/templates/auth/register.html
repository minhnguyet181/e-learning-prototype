<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <body th:replace="layout :: layout('Đăng ký', ~{::content})">
    <th:block th:fragment="content">
      <div class="auth-wrapper">
        <div class="container">
          <h2>Đăng ký tài khoản</h2>

          <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

          <form th:action="@{/register}" th:object="${form}" method="post">
            <label for="fullName">Họ và tên</label>
            <input th:field="*{fullName}" id="fullName" autocomplete="name" placeholder="Nguyễn Văn A" />
            <div class="error-text" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>

            <label for="email">Email</label>
            <input th:field="*{email}" id="email" type="email" autocomplete="email" placeholder="example@email.com" />
            <div class="error-text" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

            <label for="password">Mật khẩu</label>
            <input th:field="*{password}" id="password" type="password" autocomplete="new-password" placeholder="Tối thiểu 6 ký tự" />
            <div class="error-text" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>

            <label for="confirmPassword">Xác nhận mật khẩu</label>
            <input th:field="*{confirmPassword}" id="confirmPassword" type="password" autocomplete="new-password" placeholder="Nhập lại mật khẩu" />
            <div class="error-text" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>

            <button type="submit" style="margin-top:1rem;">Đăng ký</button>
          </form>

          <div class="auth-links">
            Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a>
          </div>
        </div>
      </div>
    </th:block>
  </body>
</html>
