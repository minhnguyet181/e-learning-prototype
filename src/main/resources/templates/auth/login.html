<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <body th:replace="layout :: layout('Đăng nhập', ~{::content})">
    <th:block th:fragment="content">
      <main>
        <div class="container">
          <h2>Đăng nhập</h2>
          <form th:action="@{/login}" th:object="${form}" method="post">
            <label>Username</label>
            <input th:field="*{username}" autocomplete="username" />
            <div class="error-text" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>

            <label>Mật khẩu</label>
            <input th:field="*{password}" type="password" autocomplete="current-password" />
            <div class="error-text" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>

            <button type="submit">Đăng nhập</button>
          </form>

          <div class="helper">
            Chưa có tài khoản? <a th:href="@{/register}">Đăng ký</a>
          </div>
        </div>
      </main>
    </th:block>
  </body>
</html>
