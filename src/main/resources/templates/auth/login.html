<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <body th:replace="layout :: layout('Đăng nhập', ~{::content})">
    <th:block th:fragment="content">
      <div class="auth-wrapper">
        <div class="container">
          <h2>Đăng nhập</h2>

          <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
          <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

          <form th:action="@{/login}" th:object="${form}" method="post">
            <label for="email">Email</label>
            <input th:field="*{email}" id="email" type="email" autocomplete="email" placeholder="example@email.com" />
            <div class="error-text" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

            <label for="password">Mật khẩu</label>
            <input th:field="*{password}" id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
            <div class="error-text" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>

            <button type="submit" style="margin-top:1rem;">Đăng nhập</button>
          </form>

          <div class="auth-links">
            <a th:href="@{/forgot-password}">Quên mật khẩu?</a>
            <span class="sep">·</span>
            <a th:href="@{/register}">Tạo tài khoản mới</a>
          </div>
        </div>
      </div>
    </th:block>
  </body>
</html>
