<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <body th:replace="layout :: layout('Login', ~{::content})">
    <th:block th:fragment="content">
      <main>
        <div class="container">
          <h2>Login</h2>
          <form th:action="@{/login}" th:object="${form}" method="post">
            <label>Email</label>
            <input th:field="*{email}" type="email" autocomplete="email" />
            <div class="error-text" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

            <label>Password</label>
            <input th:field="*{password}" type="password" autocomplete="current-password" />
            <div class="error-text" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>

            <button type="submit">Login</button>
          </form>

          <p><a th:href="@{/forgot-password}">Forgot password?</a></p>
          <div class="helper">
            Don't have an account? <a th:href="@{/register}">Register</a>
          </div>
        </div>
      </main>
    </th:block>
  </body>
</html>
