<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <body th:replace="layout :: layout('Reset Password', ~{::content})">
    <th:block th:fragment="content">
      <main>
        <div class="container">
          <h2>Reset Password</h2>
          <p>Enter your email to receive a password reset link.</p>
          <form th:action="@{/forgot-password}" th:object="${form}" method="post">
            <label>Email</label>
            <input th:field="*{email}" type="email" autocomplete="email" />
            <div class="error-text" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

            <button type="submit">Send Reset Link</button>
          </form>

          <div class="helper">
            Remember your password? <a th:href="@{/login}">Login</a>
          </div>
        </div>
      </main>
    </th:block>
  </body>
</html>
