<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <body th:replace="layout :: layout('Quên mật khẩu', ~{::content})">
    <th:block th:fragment="content">
      <main>
        <div class="container">
          <h2>Quên mật khẩu</h2>
          <p>Nhập email của bạn để nhận liên kết đặt lại mật khẩu.</p>
          <form th:action="@{/forgot-password}" th:object="${form}" method="post">
            <label>Email</label>
            <input th:field="*{email}" type="email" autocomplete="email" />
            <div class="error-text" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

            <button type="submit">Gửi liên kết</button>
          </form>

          <div class="helper">
            Đã nhớ lại mật khẩu? <a th:href="@{/login}">Đăng nhập</a>
          </div>
        </div>
      </main>
    </th:block>
  </body>
</html>
