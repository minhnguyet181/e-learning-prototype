<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <body th:replace="layout :: layout('Quên mật khẩu', ~{::content})">
    <th:block th:fragment="content">
      <div class="auth-wrapper">
        <div class="container">
          <h2>Quên mật khẩu</h2>
          <p style="margin-top:0.5rem; color:#555;">Nhập email để nhận hướng dẫn đặt lại mật khẩu.</p>

          <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
          <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

          <form th:action="@{/forgot-password}" th:object="${form}" method="post">
            <label for="email">Email</label>
            <input th:field="*{email}" id="email" type="email" autocomplete="email" placeholder="example@email.com" />
            <div class="error-text" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

            <button type="submit" style="margin-top:1rem;">Gửi yêu cầu</button>
          </form>

          <div class="auth-links">
            <a th:href="@{/login}">← Quay lại đăng nhập</a>
          </div>
        </div>
      </div>
    </th:block>
  </body>
</html>
