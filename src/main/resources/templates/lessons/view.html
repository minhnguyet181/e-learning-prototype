<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <body th:replace="layout :: layout('Bài giảng', ~{::content})">
    <th:block th:fragment="content">
      <div class="page">
        <a class="back-link" th:href="@{/courses/{id}(id=${course.id})}">← Quay lại khóa học</a>

        <div class="lesson-view-card" style="margin-top: 1rem;">
          <div class="lesson-view-header">
            <div class="badge-row">
              <span class="badge" th:text="${course.courseCode}">CODE</span>
              <span class="badge dark" th:text="${course.courseName}">Course</span>
            </div>
            <h2 th:text="${lesson.lessonTitle}" style="margin-top:0.75rem;">Tên bài giảng</h2>
          </div>

          <div class="lesson-view-body">
            <div th:if="${lesson.videoUrl != null and !#strings.isEmpty(lesson.videoUrl)}" class="video-wrapper">
              <iframe th:src="${lesson.videoUrl}" allowfullscreen title="Video bài giảng"></iframe>
            </div>

            <div class="lesson-content-box">
              <h4 style="margin-bottom:0.75rem; color:#0a66c2;">Nội dung bài giảng</h4>
              <div th:text="${lesson.lessonContent}">Nội dung</div>
            </div>

            <div th:if="${lesson.documentUrl != null and !#strings.isEmpty(lesson.documentUrl)}" class="doc-link">
              <a th:href="${lesson.documentUrl}" target="_blank" rel="noopener">📄 Tải tài liệu đính kèm</a>
            </div>
          </div>

          <div class="lesson-view-footer">
            <form th:action="@{/courses/{courseId}/lessons/{lessonId}/complete(courseId=${course.id},lessonId=${lesson.id})}" method="post">
              <button type="submit" class="btn-complete">✓ Đánh dấu hoàn thành</button>
            </form>
          </div>
        </div>
      </div>
    </th:block>
  </body>
</html>
