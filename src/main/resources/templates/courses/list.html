<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <body th:replace="layout :: layout('Khóa học', ~{::content})">
    <th:block th:fragment="content">
      <div class="page">
        <h2>Danh sách khóa học</h2>
        <div class="card-grid" style="margin-top: 1rem;">
          <div class="card" th:each="c : ${courses}">
            <img src="https://via.placeholder.com/600x280" alt="Khóa học">
            <div class="content">
              <div style="display:flex; gap:0.5rem; flex-wrap:wrap; align-items:center; margin-bottom:0.5rem;">
                <span class="badge" th:text="${c.courseCode}">CODE</span>
                <span class="badge dark" th:text="${c.status}">PUBLISHED</span>
                <span class="badge" th:if="${c.semester}" th:text="${c.semester}">SEM</span>
              </div>
              <h4 th:text="${c.courseName}">Course name</h4>
              <p th:text="${#strings.abbreviate(c.description, 140)}">desc</p>
              <a class="btn-link" th:href="@{/courses/{id}(id=${c.id})}">Xem chi tiết →</a>
            </div>
          </div>
        </div>
      </div>
    </th:block>
  </body>
</html>
