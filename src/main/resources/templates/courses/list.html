<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <body th:replace="layout :: layout('Khóa học', ~{::content})">
    <th:block th:fragment="content">
      <div class="d-flex align-items-center justify-content-between mb-3">
        <h1 class="h4 mb-0">Danh sách khóa học</h1>
        <div class="small text-muted">Chỉ hiển thị khóa học PUBLISHED</div>
      </div>

      <div class="row g-3">
        <div class="col-md-6 col-lg-4" th:each="c : ${courses}">
          <div class="card h-100">
            <div class="card-body">
              <div class="d-flex justify-content-between">
                <div class="badge text-bg-secondary" th:text="${c.courseCode}">CODE</div>
                <div class="badge text-bg-success" th:text="${c.status}">PUBLISHED</div>
              </div>
              <h2 class="h6 mt-3" th:text="${c.courseName}">Course name</h2>
              <p class="text-muted small mb-3" th:text="${#strings.abbreviate(c.description, 120)}">desc</p>
              <a class="btn btn-primary btn-sm" th:href="@{/courses/{id}(id=${c.id})}">Xem chi tiết</a>
            </div>
          </div>
        </div>
      </div>
    </th:block>
  </body>
</html>
