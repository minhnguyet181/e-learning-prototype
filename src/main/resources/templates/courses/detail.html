<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <body th:replace="layout :: layout('Chi tiết khóa học', ~{::content})">
    <th:block th:fragment="content">
      <div class="page">
        <a th:href="@{/courses}">← Quay lại danh sách</a>

        <div class="card" style="margin-top: 1rem;">
          <img src="https://via.placeholder.com/600x280" alt="Khóa học">
          <div class="content">
            <div style="display:flex; gap:0.5rem; flex-wrap:wrap; align-items:center; margin-bottom:0.5rem;">
              <span class="badge" th:text="${course.courseCode}">CODE</span>
              <span class="badge dark" th:text="${course.status}">STATUS</span>
              <span class="badge" th:if="${course.semester}" th:text="${course.semester}">SEM</span>
            </div>
            <h4 th:text="${course.courseName}">Course name</h4>
            <p th:text="${course.description}">desc</p>

            <div th:if="${currentUser == null}" class="helper">
              Bạn cần <a th:href="@{/login}">đăng nhập</a> để đăng ký khóa học và vào bài học.
            </div>

            <div th:if="${currentUser != null}">
              <div th:if="${enrolled}" class="helper">
                <span class="badge dark">Đã đăng ký</span>
              </div>
              <div th:if="${!enrolled}">
                <form th:action="@{/courses/{id}/enroll(id=${course.id})}" method="post" style="margin-top: 0.75rem;">
                  <div th:if="${course.enrollPassword != null and !#strings.isEmpty(course.enrollPassword)}">
                    <label>Mật khẩu khóa học</label>
                    <input name="password" placeholder="VD: join123" />
                    <div class="helper">Khóa demo dùng password: <strong>join123</strong></div>
                  </div>
                  <button type="submit" style="max-width: 220px; margin-top: 0.75rem;">Đăng ký</button>
                </form>
              </div>
            </div>
          </div>
        </div>

        <h2 style="margin-top: 1.5rem;">Danh sách bài học</h2>
        <div class="card-grid" style="margin-top: 1rem;">
          <a class="card"
             th:each="l : ${lessons}"
             th:href="@{/courses/{courseId}/lessons/{lessonId}(courseId=${course.id},lessonId=${l.id})}">
            <img src="https://via.placeholder.com/600x280" alt="Bài học">
            <div class="content">
              <h4 th:text="${l.lessonOrder + '. ' + l.lessonTitle}">Lesson</h4>
              <p th:text="${#strings.abbreviate(l.lessonContent, 120)}">preview</p>
              <span class="badge">Mở</span>
            </div>
          </a>
        </div>
      </div>
    </th:block>
  </body>
</html>
