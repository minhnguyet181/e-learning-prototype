<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <body th:replace="layout :: layout('Chi tiết khóa học', ~{::content})">
    <th:block th:fragment="content">
      <div class="page">
        <a class="back-link" th:href="@{/courses}">← Danh sách khóa học</a>

        <div class="card detail-card" style="margin-top: 1rem;">
          <div class="card-thumb">
            <img th:src="${course.thumbnailUrl} ?: 'https://via.placeholder.com/1200x400/e6f0ff/0a66c2?text=' + ${course.courseCode}"
                 th:alt="${course.courseName}" />
          </div>
          <div class="content">
            <div class="badge-row">
              <span class="badge" th:text="${course.courseCode}">CODE</span>
              <span class="badge dark" th:text="${course.status}">STATUS</span>
              <span class="badge" th:if="${course.semester}" th:text="${course.semester}">SEM</span>
              <span class="badge" th:if="${course.academicYear}" th:text="${course.academicYear}">YEAR</span>
            </div>
            <h3 th:text="${course.courseName}" style="margin: 0.75rem 0 0.5rem;">Tên khóa học</h3>
            <p th:text="${course.description}" style="color:#555;">Mô tả</p>

            <div class="enroll-section">
              <div th:if="${currentUser == null}" class="alert alert-info">
                Bạn cần <a th:href="@{/login}">đăng nhập</a> để đăng ký và xem bài giảng.
              </div>

              <div th:if="${currentUser != null and enrolled}" style="margin-top:0.75rem;">
                <span class="badge dark" style="font-size:0.95rem; padding:0.35rem 0.85rem;">✓ Đã đăng ký</span>
              </div>

              <div th:if="${currentUser != null and !enrolled}" style="margin-top:0.75rem;">
                <form th:action="@{/courses/{id}/enroll(id=${course.id})}" method="post" class="enroll-form">
                  <div th:if="${course.enrollPassword != null and !#strings.isEmpty(course.enrollPassword)}" class="enroll-password">
                    <label for="coursePassword">Mật khẩu khóa học</label>
                    <input id="coursePassword" name="password" type="password" placeholder="Nhập mật khẩu khóa học" />
                    <div class="helper">Demo: mật khẩu là <strong>join123</strong></div>
                  </div>
                  <button type="submit" class="btn-enroll">Đăng ký khóa học</button>
                </form>
              </div>
            </div>
          </div>
        </div>

        <div style="margin-top: 2rem;">
          <h2>Danh sách bài giảng</h2>
          <div th:if="${#lists.isEmpty(lessons)}" class="empty-state" style="margin-top:1rem;">
            <p>Chưa có bài giảng nào.</p>
          </div>
          <div class="lesson-list" th:unless="${#lists.isEmpty(lessons)}">
            <a class="lesson-item"
               th:each="l : ${lessons}"
               th:href="@{/courses/{courseId}/lessons/{lessonId}(courseId=${course.id},lessonId=${l.id})}">
              <div class="lesson-order" th:text="${l.lessonOrder}">1</div>
              <div class="lesson-info">
                <div class="lesson-title" th:text="${l.lessonTitle}">Tên bài</div>
                <div class="lesson-preview" th:text="${#strings.abbreviate(l.lessonContent ?: '', 100)}">preview</div>
              </div>
              <div class="lesson-arrow">→</div>
            </a>
          </div>
        </div>
      </div>
    </th:block>
  </body>
</html>
