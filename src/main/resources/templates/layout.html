<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${pageTitle} ?: 'E-Learning'">E-Learning</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body th:fragment="layout(pageTitle, content)">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" th:href="@{/}">E-Learning</a>
        <div class="collapse navbar-collapse show">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" th:href="@{/courses}">Khóa học</a></li>
          </ul>
          <div class="d-flex gap-2 align-items-center">
            <div th:if="${currentUser != null}" class="text-white small">
              Xin chào, <strong th:text="${currentUser.fullName}">User</strong>
              (<span th:text="${currentUser.role}">ROLE</span>)
            </div>
            <a th:if="${currentUser == null}" class="btn btn-outline-light btn-sm" th:href="@{/login}">Đăng nhập</a>
            <a th:if="${currentUser == null}" class="btn btn-warning btn-sm" th:href="@{/register}">Đăng ký</a>
            <form th:if="${currentUser != null}" th:action="@{/logout}" method="post" class="m-0">
              <button class="btn btn-outline-light btn-sm" type="submit">Đăng xuất</button>
            </form>
          </div>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
      <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
      <div th:replace="${content}"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
