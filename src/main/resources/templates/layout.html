<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${pageTitle} ?: 'E-Learning'">E-Learning</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body th:fragment="layout(pageTitle, content)">
    <header>
      <nav id="top-nav">
        <div class="logo"><a th:href="@{/}">E-Learning IT</a></div>
        <div class="nav-toggle" role="button" aria-label="Toggle navigation" onclick="toggleNav()">&#9776;</div>
        <div class="links">
          <a th:href="@{/courses}">Courses</a>
          <a th:if="${currentUser == null}" th:href="@{/login}">Login</a>
          <a th:if="${currentUser == null}" th:href="@{/register}">Register</a>
          <span th:if="${currentUser != null}">
            Hello, <strong th:text="${currentUser.fullName}">User</strong>
            (<span th:text="${currentUser.role}">ROLE</span>)
          </span>
          <form th:if="${currentUser != null}" th:action="@{/logout}" method="post" style="display:inline;">
            <button type="submit" style="width:auto; padding:0.35rem 0.75rem;">Logout</button>
          </form>
        </div>
      </nav>
    </header>

    <main>
      <div th:replace="${content}"></div>
    </main>

    <div th:if="${success}" class="toast success" th:text="${success}"></div>
    <div th:if="${error}" class="toast error" th:text="${error}"></div>

    <footer>
      &copy; <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2026</span> E-Learning IT. All rights reserved.
    </footer>

    <script>
      function toggleNav() {
        const nav = document.getElementById('top-nav');
        nav && nav.classList.toggle('open');
      }
    </script>
  </body>
</html>
