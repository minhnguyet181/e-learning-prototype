server:
  port: 8080

spring:
  application:
    name: elearning
  thymeleaf:
    cache: false
  datasource:
    url: jdbc:mysql://localhost:3306/elearning_db?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    username: elearning
    password: elearning
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  sql:
    init:
      mode: never

logging:
  level:
    org.hibernate.SQL: warn
